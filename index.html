<!DOCTYPE html>
<html lang="ar" dir="rtl" data-th="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>فكّروني</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg1:#0d0f2b;--bg2:#1d1352;--gl:rgba(255,255,255,.09);--bd:rgba(255,255,255,.2);--tx:#f4f3ff;--mut:rgba(244,243,255,.62);--ac:#8b7bff;--ac2:#2ee6d0;--warm:#ff8fb1;--ease:cubic-bezier(.2,.8,.2,1)}
[data-th=light]{--bg1:#e6ebff;--bg2:#f6e8ff;--gl:rgba(255,255,255,.55);--bd:rgba(255,255,255,.95);--tx:#1c1b3a;--mut:rgba(28,27,58,.6);--ac:#6a55f5;--ac2:#00b8a5}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;font-family:'Readex Pro',Tahoma,sans-serif;color:var(--tx);background:linear-gradient(135deg,var(--bg1),var(--bg2));transition:background .5s}
.bg{position:fixed;inset:0;overflow:hidden;z-index:0}
.bg i{position:absolute;border-radius:50%;filter:blur(80px);opacity:.55;animation:fl 18s ease-in-out infinite alternate}
.bg i:nth-child(1){width:46vmax;height:46vmax;background:#6b4dff;top:-12vmax;right:-8vmax}
.bg i:nth-child(2){width:38vmax;height:38vmax;background:#00c9b7;bottom:-12vmax;left:-8vmax;animation-delay:-6s}
.bg i:nth-child(3){width:26vmax;height:26vmax;background:#ff7aa8;top:40%;left:38%;opacity:.35;animation-delay:-11s}
@keyframes fl{to{transform:translate(6vmax,-5vmax) scale(1.15)}}
.app{position:relative;z-index:1;max-width:1040px;margin:auto;padding:22px;display:grid;grid-template-columns:220px 1fr;gap:22px;align-items:start}
.gl{background:var(--gl);border:1px solid var(--bd);border-radius:24px;-webkit-backdrop-filter:blur(26px) saturate(150%);backdrop-filter:blur(26px) saturate(150%);box-shadow:0 10px 40px rgba(0,0,0,.18)}
nav{position:sticky;top:22px;padding:14px;display:flex;flex-direction:column;gap:4px}
.logo{font-size:26px;font-weight:700;padding:6px 10px 14px;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
nav button{position:relative;z-index:1;display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--mut);font:500 15px inherit;font-family:inherit;padding:11px 12px;border-radius:14px;cursor:pointer;transition:color .3s}
nav button.on{color:var(--tx)}
nav svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pill{position:absolute;left:0;top:0;z-index:0;border-radius:14px;background:linear-gradient(135deg,rgba(139,123,255,.55),rgba(46,230,208,.35));border:1px solid var(--bd);transition:transform .45s var(--ease),width .3s,height .3s}
#th{margin-top:8px;justify-content:center;border:1px solid var(--bd)}
main{min-width:0}
.tab{display:none}
.tab.on{display:grid;gap:18px;animation:in .5s var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(16px) scale(.985)}}
.card{padding:22px}
h2{font-size:22px;font-weight:600;margin-bottom:4px}
h3{font-size:16px;font-weight:500;color:var(--mut);margin-bottom:12px}
.mut{color:var(--mut);font-size:14px}
button,select,input{font:inherit;color:var(--tx)}
.btn{cursor:pointer;background:linear-gradient(135deg,var(--ac),#5fa8ff);border:0;border-radius:14px;padding:10px 20px;font-weight:500;color:#fff;transition:transform .2s var(--ease),filter .2s}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}.btn:active{transform:scale(.96)}
.ghost{background:var(--gl);border:1px solid var(--bd);color:var(--tx)}
input[type=text],select{background:var(--gl);border:1px solid var(--bd);border-radius:14px;padding:10px 14px;min-width:0;outline:0}
select option{color:#111}
:focus-visible{outline:2px solid var(--ac2);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grow{flex:1}
.hero{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.ring{position:relative;width:190px;height:190px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8;stroke-linecap:round}
.ring .tr{stroke:var(--bd)}
.ring .fg{stroke:url(#g);stroke-dasharray:326.7;stroke-dashoffset:326.7;transition:stroke-dashoffset 1s var(--ease)}
.ring div{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring b{font-size:30px;font-weight:600;direction:ltr;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.chip{background:var(--gl);border:1px solid var(--bd);border-radius:999px;padding:6px 14px;font-size:14px}
.bar{height:8px;border-radius:99px;background:var(--bd);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .8s var(--ease)}
ul{list-style:none;padding:0;display:grid;gap:8px;margin-top:14px}
li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--gl);border:1px solid var(--bd);animation:in .4s var(--ease)}
li span{flex:1;overflow-wrap:anywhere;transition:opacity .3s}
li.done span{text-decoration:line-through;opacity:.45}
.ck{appearance:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--mut);cursor:pointer;display:grid;place-content:center;flex:none;transition:.25s}
.ck:checked{background:linear-gradient(135deg,var(--ac),var(--ac2));border-color:transparent}
.ck::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) scale(0);transition:transform .25s var(--ease);margin-top:-2px}
.ck:checked::after{transform:rotate(45deg) scale(1)}
.ib{background:none;border:0;cursor:pointer;font-size:18px;opacity:.7;padding:2px 6px;color:var(--tx)}.ib:hover{opacity:1}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{cursor:pointer;background:none;border:1px solid var(--bd);border-radius:999px;padding:6px 16px;color:var(--mut);transition:.25s}
.seg button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.pr{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-radius:16px;background:var(--gl);border:1px solid var(--bd);cursor:pointer;transition:.3s var(--ease)}
.pr.nx{border-color:var(--ac2);box-shadow:0 0 0 3px rgba(46,230,208,.2)}
.pr.done{background:linear-gradient(135deg,rgba(139,123,255,.35),rgba(46,230,208,.25))}
.pr b{direction:ltr;font-variant-numeric:tabular-nums}
.wk{display:flex;gap:10px;align-items:flex-end;height:110px;margin-top:8px}
.wk div{flex:1;text-align:center;font-size:12px;color:var(--mut);display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:6px}
.wk i{display:block;border-radius:8px;background:linear-gradient(var(--ac2),var(--ac));min-height:4px;transition:height .8s var(--ease)}
.zk{padding:16px;border-radius:16px;background:var(--gl);border:1px solid var(--bd);font-size:19px;line-height:2;animation:in .4s var(--ease)}
.zk small{display:block;font-size:13px;color:var(--ac2)}
#tas{position:relative;overflow:hidden;width:170px;height:170px;border-radius:50%;border:1px solid var(--bd);background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.35),rgba(139,123,255,.45));font-size:54px;font-weight:600;cursor:pointer;margin:6px auto;display:block;box-shadow:0 10px 40px rgba(139,123,255,.35);transition:transform .15s}
#tas:active{transform:scale(.94)}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);transform:scale(0);animation:rp .6s ease-out forwards;pointer-events:none}
@keyframes rp{to{transform:scale(4);opacity:0}}
.cf{position:fixed;top:-10px;width:9px;height:14px;border-radius:2px;z-index:9;animation:fall 1.8s ease-in forwards;pointer-events:none}
@keyframes fall{to{transform:translate(var(--x),105vh) rotate(var(--r));opacity:.9}}
.big{font-size:42px;font-weight:600;direction:ltr;font-variant-numeric:tabular-nums}
#wel{position:fixed;inset:0;z-index:20;display:none;place-items:center;padding:18px;background:rgba(8,8,30,.45);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#wel.on{display:grid;animation:in .5s var(--ease)}
#wel .gl{width:100%;max-width:400px;padding:28px;display:grid;gap:12px}
#wel h1{font-size:30px;font-weight:700;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
#wel label{font-size:14px;color:var(--mut);display:grid;gap:6px}
#err{color:var(--warm);font-size:14px;min-height:20px}
@media(max-width:760px){
.app{grid-template-columns:1fr;padding:14px 12px 110px}
nav{position:fixed;bottom:10px;left:10px;right:10px;top:auto;flex-direction:row;justify-content:space-around;padding:6px;z-index:5;border-radius:22px}
.logo,#th,#lo{display:none}
nav button{flex-direction:column;gap:3px;font-size:11px;padding:8px 4px;flex:1}
.ring{width:160px;height:160px;margin:auto}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="wel"><form class="gl" id="wf" novalidate>
<h1>أهلاً بيك في فكّروني</h1>
<p class="mut">سجّل اسمك وإيميلك عشان نبدأ.</p>
<label>الاسم<input type="text" id="wn" autocomplete="name" maxlength="40" required></label>
<label>الإيميل<input type="text" id="we" inputmode="email" autocomplete="email" dir="ltr" required></label>
<div id="err" role="alert"></div>
<button class="btn" type="submit">يلا نبدأ</button>
<p class="mut" style="font-size:12px">بنستخدم إيميلك للتواصل معاك بخصوص الموقع فقط.</p>
</form></div>
<div class="bg"><i></i><i></i><i></i></div>
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b7bff"/><stop offset="1" stop-color="#2ee6d0"/></linearGradient></defs></svg>
<div class="app">
<nav class="gl" id="nav">
<div class="pill"></div>
<div class="logo">فكّروني</div>
<button data-t="today" class="on"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10H3z"/></svg>اليوم</button>
<button data-t="tasks"><svg viewBox="0 0 24 24"><path d="M5 12l4 4 10-10"/></svg>المهام</button>
<button data-t="focus"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg>التركيز</button>
<button data-t="prayer"><svg viewBox="0 0 24 24"><path d="M20 14A8 8 0 1110 4a7 7 0 0010 10z"/></svg>الصلاة</button>
<button data-t="azkar"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 012-2h13v18H6a2 2 0 01-2-2zM4 19a2 2 0 012-2h13"/></svg>الأذكار</button>
<button id="th">تبديل الثيم</button>
<button id="lo" style="justify-content:center">تسجيل خروج</button>
</nav>
<main>

<section class="tab on" id="today">
<div class="card gl hero">
<div class="ring" id="r1"><svg viewBox="0 0 120 120"><circle class="tr" cx="60" cy="60" r="52"/><circle class="fg" cx="60" cy="60" r="52"/></svg><div><span class="mut" id="nn">…</span><b id="cd">--:--:--</b></div></div>
<div class="grow"><h2 id="hello"></h2><p class="mut" id="sub"></p>
<div class="chips"><span class="chip" id="c1"></span><span class="chip" id="c2"></span></div>
<div class="bar"><i id="pb"></i></div></div>
</div>
<div class="card gl"><h3>أهم مهامك دلوقتي</h3><ul id="top3"></ul></div>
</section>

<section class="tab" id="tasks">
<div class="card gl"><h2>المهام</h2>
<form class="row" onsubmit="return false" style="margin:12px 0"><input type="text" id="ti" class="grow" placeholder="اكتب مهمة جديدة" aria-label="مهمة جديدة"><button class="btn" id="add">إضافة</button></form>
<div class="seg" id="flt"><button data-f="all" class="on">الكل</button><button data-f="open">لسه</button><button data-f="done">خلصت</button></div>
<ul id="tl"></ul><p class="mut" id="tmsg" style="margin-top:14px"></p></div>
</section>

<section class="tab" id="focus">
<div class="card gl" style="text-align:center"><h2>التركيز</h2><p class="mut" id="fm">جولة تركيز</p>
<div class="ring" id="r2" style="margin:18px auto"><svg viewBox="0 0 120 120"><circle class="tr" cx="60" cy="60" r="52"/><circle class="fg" cx="60" cy="60" r="52" style="stroke-dashoffset:0"/></svg><div><b id="tm" style="font-size:40px">25:00</b></div></div>
<div class="row" style="justify-content:center"><button class="btn" id="ps">ابدأ</button><button class="btn ghost" id="pr2">من الأول</button><button class="btn ghost" id="pmd">استراحة</button></div></div>
</section>

<section class="tab" id="prayer">
<div class="card gl"><div class="row"><h2 class="grow">مواقيت الصلاة</h2><select id="city" aria-label="المدينة"></select></div>
<ul id="pl"></ul><p class="mut" id="prmsg" style="margin-top:14px"></p></div>
<div class="card gl"><h3>صلواتك آخر 7 أيام</h3><div class="wk" id="wk"></div></div>
</section>

<section class="tab" id="azkar">
<div class="card gl"><h2>الأذكار</h2>
<div class="seg" id="zt" style="margin:10px 0"><button data-k="m">الصباح</button><button data-k="e">المساء</button></div>
<div id="zl" style="display:grid;gap:10px"></div></div>
<div class="card gl" style="text-align:center"><h3>عدّاد التسبيح</h3>
<button id="tas" aria-label="عدّاد التسبيح">0</button>
<div class="row" style="justify-content:center;margin-top:10px"><select id="tgt" aria-label="الهدف"><option>33</option><option>100</option><option value="0">مفتوح</option></select><button class="btn ghost" id="tr">صفّر</button></div></div>
</section>

</main></div>
<script>
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const L=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}};
const S=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const day=(d=new Date())=>d.toLocaleDateString('en-CA'),C=326.7;
const setRing=(id,f)=>{$('#'+id+' .fg').style.strokeDashoffset=C*(1-Math.min(1,Math.max(0,f)))};

/* التسجيل: ضع رابط Formspree هنا لو عايز توصلك بيانات المسجلين */
const SIGNUP_URL='';
let user=L('user',null);
const showWel=()=>{$('#wel').classList.add('on');$('#wn').focus()};
$('#wf').onsubmit=e=>{
  e.preventDefault();
  const name=$('#wn').value.trim(),email=$('#we').value.trim().toLowerCase();
  if(name.length<2){$('#err').textContent='اكتب اسمك من فضلك.';return}
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){$('#err').textContent='الإيميل مش مظبوط، راجعه.';return}
  user={name,email,at:new Date().toISOString()};S('user',user);$('#err').textContent='';
  if(SIGNUP_URL)fetch(SIGNUP_URL,{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify(user)}).catch(()=>{});
  $('#wel').classList.remove('on');renderToday();
};
$('#lo').onclick=()=>{try{localStorage.removeItem('user')}catch(e){}user=null;$('#wn').value=user?'':'';showWel()};
/* ثيم */
document.documentElement.dataset.th=L('th','dark');
$('#th').onclick=()=>{const t=document.documentElement.dataset.th==='dark'?'light':'dark';document.documentElement.dataset.th=t;S('th',t)};

/* تابات */
function place(){const b=$('#nav .on'),p=$('.pill');p.style.width=b.offsetWidth+'px';p.style.height=b.offsetHeight+'px';p.style.transform='translate('+b.offsetLeft+'px,'+b.offsetTop+'px)'}
$$('#nav button[data-t]').forEach(b=>b.onclick=()=>{
  $$('#nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  $$('.tab').forEach(t=>t.classList.toggle('on',t.id===b.dataset.t));place();
});
addEventListener('resize',place);addEventListener('load',place);
if(document.fonts)document.fonts.ready.then(place);place();

/* الصلاة */
const CITIES={'القاهرة':'Cairo','الإسكندرية':'Alexandria','الجيزة':'Giza','كفر الشيخ':'Kafr El-Sheikh','طنطا':'Tanta','المنصورة':'Mansoura','الزقازيق':'Zagazig','أسيوط':'Asyut','الأقصر':'Luxor','أسوان':'Aswan','بورسعيد':'Port Said','السويس':'Suez'};
const PN={Fajr:'الفجر',Dhuhr:'الظهر',Asr:'العصر',Maghrib:'المغرب',Isha:'العشاء'};
const cs=$('#city');for(const k in CITIES)cs.add(new Option(k,CITIES[k]));cs.value=L('city','Cairo');
let times=null;
const at=t=>{const [a,b]=t.split(':'),d=new Date();d.setHours(+a,+b,0,0);return d};
async function loadTimes(){
  const c=cs.value;S('city',c);const key='pt_'+c+day();times=L(key,null);
  if(!times){try{
    const r=await fetch('https://api.aladhan.com/v1/timingsByCity?city='+encodeURIComponent(c)+'&country=Egypt&method=5');
    const j=await r.json();times={};for(const p in PN)times[p]=j.data.timings[p].slice(0,5);S(key,times);
  }catch(e){$('#prmsg').textContent='مفيش نت دلوقتي، هحمّل المواقيت أول ما يرجع.'}}
  renderPrayers();
}
cs.onchange=loadTimes;
function nextP(){
  if(!times)return null;const now=new Date(),ks=Object.keys(PN);
  for(let i=0;i<5;i++){if(at(times[ks[i]])>now){
    let prev=i?at(times[ks[i-1]]):at(times.Isha);if(!i)prev.setDate(prev.getDate()-1);
    return{p:ks[i],at:at(times[ks[i]]),prev}}}
  const f=at(times.Fajr);f.setDate(f.getDate()+1);return{p:'Fajr',at:f,prev:at(times.Isha)};
}
const logOf=d=>(L('log',{})[d]||{});
function renderPrayers(){
  const ul=$('#pl');ul.innerHTML='';const log=logOf(day()),nx=nextP();
  if(times)for(const p in PN){
    const li=document.createElement('li');li.className='pr'+(log[p]?' done':'')+(nx&&nx.p===p?' nx':'');li.tabIndex=0;li.style.animation='none';
    li.innerHTML='<span></span><b></b>';li.children[0].textContent=(log[p]?'✓ ':'')+PN[p];li.children[1].textContent=times[p];
    const tg=()=>{const a=L('log',{});a[day()]=a[day()]||{};a[day()][p]=!a[day()][p];S('log',a);renderPrayers()};
    li.onclick=tg;li.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tg()}};ul.appendChild(li);
  }
  const n=Object.values(log).filter(Boolean).length;let st=0;
  for(let i=0;i<365;i++){const d=new Date();d.setDate(d.getDate()-i);const c=Object.values(logOf(day(d))).filter(Boolean).length;if(c===5)st++;else if(i>0)break}
  $('#prmsg').textContent='اضغط على الصلاة لما تصليها'+(st?' • '+st+' يوم متواصل':'');
  $('#c2').textContent='الصلوات '+n+'/5';
  const wk=$('#wk');wk.innerHTML='';
  for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const c=Object.values(logOf(day(d))).filter(Boolean).length;
    const w=document.createElement('div');w.innerHTML='<i style="height:0"></i><span></span>';w.children[1].textContent=d.toLocaleDateString('ar-EG',{weekday:'short'});wk.appendChild(w);
    requestAnimationFrame(()=>requestAnimationFrame(()=>w.children[0].style.height=(c/5*100)+'%'));}
  renderToday();
}
const f2=n=>String(n).padStart(2,'0');
setInterval(()=>{const nx=nextP();if(!nx)return;
  const s=Math.max(0,Math.floor((nx.at-new Date())/1000));
  $('#nn').textContent='باقي على '+PN[nx.p];$('#cd').textContent=f2(Math.floor(s/3600))+':'+f2(Math.floor(s%3600/60))+':'+f2(s%60);
  setRing('r1',(new Date()-nx.prev)/(nx.at-nx.prev));if(s===0)renderPrayers()},1000);

/* المهام */
let tasks=L('tasks',[]),flt='all';
const sv=()=>{S('tasks',tasks);renderTasks();renderToday()};
function row(t,i){
  const li=document.createElement('li');li.className=t.done?'done':'';
  const ck=document.createElement('input');ck.type='checkbox';ck.className='ck';ck.checked=t.done;ck.setAttribute('aria-label','خلّصت');
  ck.onchange=()=>{t.done=ck.checked;sv();if(t.done&&tasks.every(x=>x.done))confetti()};
  const sp=document.createElement('span');sp.textContent=t.t;
  const st=document.createElement('button');st.className='ib';st.textContent=t.star?'★':'☆';st.setAttribute('aria-label','مهم');st.onclick=()=>{t.star=!t.star;sv()};
  const dl=document.createElement('button');dl.className='ib';dl.textContent='✕';dl.setAttribute('aria-label','امسح');dl.onclick=()=>{tasks.splice(i,1);sv()};
  li.append(ck,sp,st,dl);return li;
}
function renderTasks(){
  const ul=$('#tl');ul.innerHTML='';
  tasks.map((t,i)=>[t,i]).filter(([t])=>flt==='all'||(flt==='open')!==t.done).sort((a,b)=>a[0].done-b[0].done||b[0].star-a[0].star).forEach(([t,i])=>ul.appendChild(row(t,i)));
  const left=tasks.filter(t=>!t.done).length;
  $('#tmsg').textContent=!tasks.length?'مفيش مهام لسه. ابدأ بأهم حاجة واحدة.':left?'فاضل '+left+'. اللي مخلصش النهارده بيفضل لبكرة.':'خلّصت كل حاجة، عاش يا بطل.';
}
$('#add').onclick=()=>{const v=$('#ti').value.trim();if(!v)return;tasks.push({t:v,done:false,star:false});$('#ti').value='';sv()};
$('#ti').onkeydown=e=>{if(e.key==='Enter')$('#add').click()};
$$('#flt button').forEach(b=>b.onclick=()=>{$$('#flt button').forEach(x=>x.classList.remove('on'));b.classList.add('on');flt=b.dataset.f;renderTasks()});
function confetti(){const cols=['#8b7bff','#2ee6d0','#ff8fb1','#ffd166'];
  for(let i=0;i<32;i++){const e=document.createElement('i');e.className='cf';e.style.left=Math.random()*100+'vw';e.style.background=cols[i%4];
    e.style.setProperty('--x',(Math.random()*200-100)+'px');e.style.setProperty('--r',(Math.random()*720)+'deg');e.style.animationDelay=Math.random()*.4+'s';
    document.body.appendChild(e);setTimeout(()=>e.remove(),2500)}}

/* اليوم */
function renderToday(){
  const h=new Date().getHours();
  $('#hello').textContent=(h<5?'لسه صاحي؟ ربنا يعينك':h<12?'صباح الخير':h<17?'نهارك سعيد':h<20?'مساء الخير':'مساء النور')+(user?' يا '+user.name:'');
  const d=tasks.filter(t=>t.done).length;
  $('#sub').textContent=tasks.length?(d===tasks.length?'خلّصت كل مهامك النهارده.':'كمّل، فاضل '+(tasks.length-d)+' مهمة.'):'ضيف أول مهمة ليك من تاب المهام.';
  $('#c1').textContent='المهام '+d+'/'+tasks.length;
  $('#pb').style.width=(tasks.length?d/tasks.length*100:0)+'%';
  const ul=$('#top3');ul.innerHTML='';
  const open=tasks.map((t,i)=>[t,i]).filter(([t])=>!t.done).sort((a,b)=>b[0].star-a[0].star).slice(0,3);
  if(!open.length){const p=document.createElement('p');p.className='mut';p.textContent='مفيش مهام مفتوحة.';ul.appendChild(p)}
  open.forEach(([t,i])=>ul.appendChild(row(t,i)));
}

/* التركيز */
let mode=25,total=1500,left=1500,run=null;
const fm=s=>f2(Math.floor(s/60))+':'+f2(s%60);
$('#ps').onclick=()=>{
  if(run){clearInterval(run);run=null;$('#ps').textContent='كمّل';return}
  $('#ps').textContent='وقّف';$('#fm').textContent=mode===25?'ركّز في مهمة واحدة':'خد راحتك';
  run=setInterval(()=>{left--;$('#tm').textContent=fm(left);setRing('r2',1-left/total);document.title=fm(left)+' • فكّروني';
    if(left<=0){clearInterval(run);run=null;$('#ps').textContent='ابدأ';document.title='فكّروني';if(navigator.vibrate)navigator.vibrate([250,120,250]);
      $('#fm').textContent=mode===25?'خلصت الجولة، خد استراحة':'الاستراحة خلصت';mode=mode===25?5:25;total=left=mode*60;$('#tm').textContent=fm(left);$('#pmd').textContent=mode===25?'استراحة':'تركيز'}},1000);
};
const rst=()=>{clearInterval(run);run=null;total=left=mode*60;$('#tm').textContent=fm(left);setRing('r2',1);$('#ps').textContent='ابدأ'};
$('#pr2').onclick=rst;$('#pmd').onclick=()=>{mode=mode===25?5:25;$('#pmd').textContent=mode===25?'استراحة':'تركيز';rst()};
setRing('r2',1);$('#r2 .fg').style.strokeDashoffset=0;

/* الأذكار: راجع النصوص من "حصن المسلم" وزوّد عليها قبل النشر */
const AZ={m:[['أصبحنا وأصبح الملك لله، والحمد لله، لا إله إلا الله وحده لا شريك له','مرة'],['بسم الله الذي لا يضر مع اسمه شيء في الأرض ولا في السماء وهو السميع العليم','3 مرات'],['لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير','10 مرات'],['سبحان الله وبحمده','100 مرة'],['أستغفر الله وأتوب إليه','100 مرة']]};
AZ.e=AZ.m.map((z,i)=>i?z:['أمسينا وأمسى الملك لله، والحمد لله، لا إله إلا الله وحده لا شريك له','مرة']);
function showAz(k){$$('#zt button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));const z=$('#zl');z.innerHTML='';
  AZ[k].forEach(([t,n])=>{const d=document.createElement('div');d.className='zk';d.textContent=t;const s=document.createElement('small');s.textContent=n;d.appendChild(s);z.appendChild(d)})}
$$('#zt button').forEach(b=>b.onclick=()=>showAz(b.dataset.k));showAz(new Date().getHours()<15?'m':'e');
let cnt=0;
$('#tas').onclick=e=>{
  cnt++;const g=+$('#tgt').value;if(g&&cnt>g)cnt=1;$('#tas').firstChild.textContent=cnt;
  if(navigator.vibrate)navigator.vibrate(g&&cnt===g?[200,100,200]:15);
  const b=$('#tas'),r=b.getBoundingClientRect(),s=document.createElement('span');s.className='rip';
  s.style.cssText='width:40px;height:40px;left:'+(e.clientX-r.left-20)+'px;top:'+(e.clientY-r.top-20)+'px';b.appendChild(s);setTimeout(()=>s.remove(),650)};
$('#tr').onclick=()=>{cnt=0;$('#tas').firstChild.textContent=0};

renderTasks();renderToday();loadTimes();if(!user)showWel();
</script>
